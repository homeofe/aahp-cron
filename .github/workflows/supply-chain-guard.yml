name: Supply Chain Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: homeofe/supply-chain-guard@186ff846239a4de51411c172bceddcf630a1ce83  # v5.25.9
        with:
          fail-on: critical
          comment-on-pr: true
